<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cadastro de Voluntário - Abrigo São Francisco</title>
    <link rel="stylesheet" href="projects.css">
    <script src="script.js" defer></script>
</head>
<body class="creme">

    <!-- NAVBAR (Mantida igual às outras páginas) -->
    <header class="nav-bar">
        <div class="logo-container">
            <img src="imagens/logotipo_abrogoSF.svg" class="logotipo" alt="Logo do Abrigo São Francisco">
            <p class="escritalogo">
                <strong>Abrigo</strong>
                <span>São Francisco</span>
            </p>
        </div>
        <nav class="navegacao">
            <ul class="abas-nav">
                <li><a href="#">O abrigo</a></li>
                <li><a href="#">Adoção</a></li>
                <li><a href="#">Como ajudar</a></li>
                <li><a href="#">Transparência</a></li>
                <li><a href="#" class="ajudar-button">Quero ajudar ♡</a></li>
            </ul>
        </nav>
    </header>

    <!-- CONTEÚDO DO CADASTRO -->
    <main class="seccao-cadastro">
        
        <!-- Cabeçalho do Formulário -->
        <div class="cabecalho-cadastro">
            <h1>Faça parte do recomeço</h1>
            <p>Preencha seus dados para se cadastrar como voluntário do Abrigo São Francisco.</p>
        </div>

        <!-- Formulário Único -->
        <form action="pagina.php" method="POST" class="formulario-cadastro">
            
            <!-- BLOCO 1: DADOS PESSOAIS -->
            <fieldset class="grupo-campos">
                <legend>Dados Pessoais</legend>
                
                <div class="linha-form">
                    <div class="campo-form largura-total">
                        <label for="nome">Nome Completo *</label>
                        <input type="text" id="nome" name="nome" placeholder="Digite seu nome completo" required>
                    </div>
                </div>

                <div class="linha-form">
                    <div class="campo-form">
                        <label for="email">E-mail *</label>
                        <input type="email" id="email" name="email" placeholder="seu@email.com" required>
                    </div>
                    <div class="campo-form">
                        <label for="nascimento">Data de Nascimento *</label>
                        <input type="date" id="nascimento" name="nascimento" required>
                    </div>
                </div>

                <div class="linha-form">
                    <div class="campo-form">
                        <label for="cpf">CPF *</label>
                        <input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}" placeholder="000.000.000-00" title="Formato: 000.000.000-00" required>
                    </div>
                    <div class="campo-form">
                        <label for="telefone">Telefone *</label>
                        <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(00) 00000-0000" title="Formato: (00) 00000-0000" required>
                    </div>
                </div>
            </fieldset>

            <!-- BLOCO 2: ENDEREÇO -->
            <fieldset class="grupo-campos">
                <legend>Endereço</legend>
                
                <div class="linha-form">
                    <div class="campo-form">
                        <label for="cep">CEP *</label>
                        <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}" placeholder="00000-000" title="Formato: 00000-000" required>
                    </div>
                    <div class="campo-form">
                        <label for="cidade">Cidade *</label>
                        <input type="text" id="cidade" name="cidade" placeholder="Sua Cidade" required>
                    </div>
                </div>

                <div class="linha-form">
                    <div class="campo-form">
                        <label for="endereco">Endereço (Rua, Número, Bairro) *</label>
                        <input type="text" id="endereco" name="endereco" placeholder="Ex. Rua tiradentes, 123 - Guaianases" required>
                    </div>
                    <div class="campo-form">
                        <label for="estado">Estado *</label>
                        <select id="estado" name="estado" required>
                            <option value="" selected disabled>Selecione</option>
                            <option value="AC">Acre</option>
                            <option value="AL">Alagoas</option>
                            <option value="AP">Amapá</option>
                            <option value="AM">Amazonas</option>
                            <option value="BA">Bahia</option>
                            <option value="CE">Ceará</option>
                            <option value="DF">Distrito Federal</option>
                            <option value="ES">Espírito Santo</option>
                            <option value="GO">Goiás</option>
                            <option value="MA">Maranhão</option>
                            <option value="MT">Mato Grosso</option>
                            <option value="MS">Mato Grosso do Sul</option>
                            <option value="MG">Minas Gerais</option>
                            <option value="PA">Pará</option>
                            <option value="PB">Paraíba</option>
                            <option value="PR">Paraná</option>
                            <option value="PE">Pernambuco</option>
                            <option value="PI">Piauí</option>
                            <option value="RJ">Rio de Janeiro</option>
                            <option value="RN">Rio Grande do Norte</option>
                            <option value="RS">Rio Grande do Sul</option>
                            <option value="RO">Rondônia</option>
                            <option value="RR">Roraima</option>
                            <option value="SC">Santa Catarina</option>
                            <option value="SP">São Paulo</option>
                            <option value="SE">Sergipe</option>
                            <option value="TO">Tocantins</option>
                        </select>
                    </div>
                </div>
            </fieldset>

            <!-- BOTÃO DE ENVIO -->
            <div class="container-botao-enviar">
                <button type="submit" class="btn-enviar-cadastro">FINALIZAR CADASTRO</button>
            </div>

        </form>
    </main>

</body>
</html>
