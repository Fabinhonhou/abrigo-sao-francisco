	<h1><center>Faça parte do recomeço</center></h1>
    Preencha seus dados para se cadastrar como voluntário do Abrigo São Francisco. 

		<form action="pagina.php">
			<fieldset>
				<legend>Dados Pessoais: </legend>
				<br>
				<label for="nome">Nome Completo *</label>
				<input type="text" id="nome" name="nome" placeholder="Digite seu nome completo">
				</br>
				<br>					
				<label for="email">E-mail *</label>
				<input type="email" id="email" name="email" placeholder="seu@email.com">
                
                <label for="nascimento">Data de Nascimento *</label>
				<input type="date" id="nascimento" name="nascimento" placeholder="dd/mm/aaaa">
				</br>
				<br>
				<label for="cpf"> CPF *</label>
				<input type="text" id="cpf" name="cpf" pattern="[0-9]{3}\.[0-9]{3}\.[0-9]{3}-[0-9]{2}"
					placeholder="000.000.000-00" title="Formato: 000.000.000-00">

				<label for="telefone"> Telefone *</label>
                <input type="tel" id="telefone" name="telefone" pattern="([0-9]{2}\) [0-9]{5}-[0-9]{4}"
					placeholder="(00) 0000-0000" title="Formato: (00) 0000-0000">
				</br>
			</fieldset>
            </form>

        <form action="pagina.php">
			<fieldset>
				<legend>Endereço </legend>
                <br>
                <label for="cep"> CEP *</label>
                <input type="text" id="cep" name="cep" pattern="[0-9]{5}-[0-9]{3}"
                    placeholder="0000-000" title="Formato: 0000-000">
				<label for="nome">Cidade *</label>
				<input type="text" id="cidade" name="cidade" placeholder="Sua Cidade">
				</br>
                <br>
                <label for="nome">Endereço (Rua, Número, Bairro) *</label>
				<input type="text" id="endereco" name="endereco" placeholder="Ex: Rua tiradentes, 123 = Guaianases">	
                <label for="nome">Estado *</label>
				<select id="estado" name="estado" required>
                    <option value="" selected disabled>Selecione </option>
                    <option value="AC">Acre</option>
                    <option value="AL">Alagoas</option>
                    <option value="AP">Amapá</option>
                    <option value="AM">Amazonas</option>
                    <option value="BA">Bahia</option>
                    <option value="CE">Ceará</option>
                    <option value="DF">Distrito Federal</option>
                    <option value="ES">Espírito Santo</option>
                    <option value="GO">Goiás</option>
                    <option value="MA">Maranhão</option>
                    <option value="MT">Mato Grosso</option>
                    <option value="MS">Mato Grosso do Sul</option>
                    <option value="MG">Minas Gerais</option>
                    <option value="PA">Pará</option>
                    <option value="PB">Paraíba</option>
                    <option value="PR">Paraná</option>
                    <option value="PE">Pernambuco</option>
                    <option value="PI">Piauí</option>
                    <option value="RJ">Rio de Janeiro</option>
                    <option value="RN">Rio Grande do Norte</option>
                    <option value="RS">Rio Grande do Sul</option>
                    <option value="RO">Rondônia</option>
                    <option value="RR">Roraima</option>
                    <option value="SC">Santa Catarina</option>
                    <option value="SP">São Paulo</option>
                    <option value="SE">Sergipe</option>
                    <option value="TO">Tocantins</option>
                </select>
		        </br>
            </fieldset>
            <br>
			<button type="submit">Finalizar Cadastro</button>
			</br>
		</form>
